name: Continuous integration

# Running on the branch main and on all PRs
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  continuous_integration:
    runs-on: ubuntu-22.04

    env:
      MIX_ENV: test
      # Fork PRs can read these caches; keep private Oban Pro packages out.
      NOTESCLUB_IS_OBAN_PRO_ENABLED: 'false'

    services:
      postgres:
        image: postgres:15.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notesclub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1.24
        id: setup-beam
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.2'

      - name: Cache Elixir dependencies and test build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-${{ runner.arch }}-mix-test-no-pro-v1-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-test-no-pro-v1-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install asset dependencies
        run: npm ci --prefix assets

      # Keep these checks in sync with the precommit alias used by mix ci.
      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Audit npm dependencies
        run: npm audit --prefix assets --audit-level=low

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Build assets
        run: mix assets.check

      - name: Run Credo
        run: mix credo --strict

      - name: Run tests with coverage
        run: mix test --cover

      - name: Run Sobelow
        run: mix sobelow --config

      - name: Cache Dialyzer PLTs
        id: cache
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Setup Dialyzer
        if: steps.cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer

  deploy:
    name: Deploy to Fly.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: continuous_integration
    runs-on: ubuntu-22.04
    concurrency:
      group: fly-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OBAN_KEY_FINGERPRINT: ${{ secrets.OBAN_KEY_FINGERPRINT }}
          OBAN_LICENSE_KEY: ${{ secrets.OBAN_LICENSE_KEY }}
        run: |
          flyctl deploy --remote-only \
            --build-secret OBAN_KEY_FINGERPRINT="$OBAN_KEY_FINGERPRINT" \
            --build-secret OBAN_LICENSE_KEY="$OBAN_LICENSE_KEY"
